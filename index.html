<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informasi Jaspel RSUD Karawang</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #263238;
}

.container {
  max-width: 480px;
  margin: 25px auto;
  background: white;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 3px 12px #0001;
}

.header {
  text-align: center;
  color: #087b55;
}

.header h2 { margin-bottom: 5px; }
.header p { color: #666; margin-top: 5px; }

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 8px;
  font-size: 16px;
}

input { border: 1px solid #bbb; }

button {
  background: #087b55;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

.note {
  font-size: 12px;
  color: #777;
  text-align: center;
  margin-top: 20px;
}

#hasil { display: none; }
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>INFORMASI JASPEL</h2>
    <p>RSUD Karawang</p>
  </div>

  <div id="halamanLogin">
    <h3>Login Pegawai</h3>

    <p>Masukkan nomor rekening dan PIN Anda.</p>

    <input
      id="rekening"
      type="text"
      inputmode="numeric"
      placeholder="Nomor rekening"
      autocomplete="username"
    >

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="PIN 6 digit"
      autocomplete="current-password"
    >

    <button type="button" onclick="loginPegawai()">
      LOGIN
    </button>
  </div>

  <div id="hasil">
    <h3>Informasi Jaspel</h3>
    <p id="nama"></p>
    <p id="pesanHasil"></p>

    <button type="button" onclick="logoutPegawai()">
      LOGOUT
    </button>
  </div>

  <p id="pesan" role="status"></p>

  <p class="note">
    Informasi Jaspel RSUD Karawang
  </p>

</div>

<script>
function loginPegawai() {
  document.getElementById("pesan").textContent =
    "Fitur login belum dihubungkan ke server.";
}

function logoutPegawai() {
  document.getElementById("hasil").style.display = "none";
  document.getElementById("halamanLogin").style.display = "block";
  document.getElementById("rekening").value = "";
  document.getElementById("pin").value = "";
  document.getElementById("pesan").textContent = "";
}
</script>

</body>
</html>
